name: Build Android APK & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Generate Android Native Project
        run: npx expo prebuild --platform android --no-install

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Artifact
        id: prepare_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found!"
            exit 1
          fi
          TAG_OR_REF="${{ github.ref_name }}"
          if [ -z "$TAG_OR_REF" ]; then
            TAG_OR_REF="latest"
          fi
          RELEASE_APK_NAME="WalkMap-${TAG_OR_REF}.apk"
          cp "$APK_PATH" "$RELEASE_APK_NAME"
          echo "apk_path=$RELEASE_APK_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$RELEASE_APK_NAME" >> $GITHUB_OUTPUT
          ls -lh "$RELEASE_APK_NAME"

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: walkmap-apk
          path: ${{ steps.prepare_apk.outputs.apk_path }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          tag_name: ${{ github.ref_name }}
          name: WalkMap ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          generate_release_notes: true
